name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_vm_repairs:
        description: 'Run fixed SFC/DISM validation on a disposable GitHub-hosted Windows VM'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Test -Publish
      - name: Extension validation
        run: node --test extension/test/protocol.test.js
      - name: Signing policy validation
        shell: pwsh
        run: ./tests/windows/Test-SigningPolicy.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Baseera-windows-preview
          path: |
            artifacts/Baseera.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
  native-repair-vm:
    if: github.event_name == 'workflow_dispatch' && inputs.native_vm_repairs
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate native servicing in a disposable guest
        shell: pwsh
        env:
          BASEERA_DISPOSABLE_VM_TEST: '1'
        run: ./tests/windows/Invoke-NativeRepairValidation.ps1 -RunNativeRepairs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Baseera-native-vm-evidence
          path: artifacts/native-vm-evidence/
